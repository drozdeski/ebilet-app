<!doctype html>
<html lang="pl" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Bilety eTravel — Offline Train Ticket Wallet</title>
    <meta name="description" content="100% network-independent train ticket holder and PWA for iOS Safari and mobile devices with IndexedDB storage and GitHub Pages hosting." />
    <meta property="og:title" content="Bilety eTravel — Offline Train Ticket Wallet" />
    <meta property="og:description" content="100% network-independent train ticket holder and PWA for iOS Safari and mobile devices with IndexedDB storage and GitHub Pages hosting." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#000000" id="theme-color-meta" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bilety" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('bilety_theme_mode');
          var isDark = saved ? saved === 'dark' : true;
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.getElementById('theme-color-meta')?.setAttribute('content', '#000000');
          } else {
            document.documentElement.classList.remove('dark');
            document.getElementById('theme-color-meta')?.setAttribute('content', '#ffffff');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F4F5F8] dark:bg-black text-slate-900 dark:text-white antialiased selection:bg-blue-600 selection:text-white overscroll-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
